<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0e5e5a">
<title>Consulta de calificación · Escuadra</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<style>
:root { --bg:#f2f5f4; --s:#fff; --s2:#eaf0ee; --ink:#12221f; --mut:#5a6c68; --line:#d9e3e0; --brand:#0e5e5a; --ok:#1c7c45; --oks:#dcf2e5; --warn:#9a5a00; --warns:#ffefd2; --bad:#bf342b; --bads:#fbe2df; color-scheme: light }
@media (prefers-color-scheme: dark) { :root { --bg:#0b1312; --s:#13201e; --s2:#1a2b28; --ink:#e4eeec; --mut:#94a8a4; --line:#25403b; --brand:#3cb4a8; --ok:#52c585; --oks:#143022; --warn:#f0a440; --warns:#3a2a12; --bad:#ff7b71; --bads:#3d1c1a; color-scheme: dark } }
* { box-sizing: border-box } body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif }
main { max-width:560px; margin:0 auto; padding:16px 16px 40px }
.top { display:flex; align-items:center; gap:10px; margin:4px 0 14px } .top svg { width:34px; height:34px }
.top b { display:block; font-size:1.05rem } .top small { color:var(--mut) }
.card { background:var(--s); border:1px solid var(--line); border-radius:14px; padding:14px 16px; margin:0 0 12px }
h1 { font-size:1.3rem; margin:0 0 4px } h2 { font-size:1rem; margin:0 0 8px } p { margin:.3em 0 .6em } .mut { color:var(--mut) } .sm { font-size:.86rem }
.big { display:flex; align-items:center; gap:14px } .cal { font-size:2.6rem; font-weight:800; border-radius:14px; padding:6px 16px; min-width:96px; text-align:center }
.ok { background:var(--oks); color:var(--ok) } .warn { background:var(--warns); color:var(--warn) } .bad { background:var(--bads); color:var(--bad) } .na { background:var(--s2); color:var(--mut) }
table { width:100%; border-collapse:collapse } td, th { padding:7px 4px; border-bottom:1px solid var(--line); text-align:left } th { font-size:.75rem; color:var(--mut); text-transform:uppercase } td.n { text-align:right; font-weight:700 }
ul { padding-left:0; list-style:none; margin:0 } li { padding:8px 0; border-bottom:1px solid var(--line) } li:last-child { border:0 }
.chip { display:inline-block; padding:1px 9px; border-radius:999px; font-size:.8rem; font-weight:700 }
.foot { font-size:.78rem; color:var(--mut); text-align:center; margin-top:18px }
</style>
</head>
<body>
<main id="m"><p>Cargando…</p></main>
<script>
(async function () {
  'use strict';
  const m = document.getElementById('m');
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const MES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  const fecha = s => { const p = String(s).split('-').map(Number); return p.length === 3 ? p[2] + ' de ' + MES[p[1] - 1] + ' de ' + p[0] : s; };
  const logo = '<svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="15" fill="#0e5e5a"/><path d="M15 51V13l38 38z" fill="#fff"/><path d="M22 44V30l14 14z" fill="#0e5e5a"/><circle cx="46" cy="18" r="5.5" fill="#f0a500"/></svg>';
  async function lee() {
    const h = location.hash.slice(1); if (!h) throw new Error('vacío');
    const b = atob(h.slice(1).replace(/-/g, '+').replace(/_/g, '/')), bytes = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) bytes[i] = b.charCodeAt(i);
    let txt;
    if (h[0] === 'z') { if (!window.DecompressionStream) throw new Error('nav'); const ds = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw')); txt = await new Response(ds).text(); }
    else txt = new TextDecoder().decode(bytes);
    return JSON.parse(txt);
  }
  let d; try { d = await lee(); } catch (e) { m.innerHTML = '<div class="card"><h1>No se pudo abrir la consulta</h1><p>' + (e.message === 'nav' ? 'Tu navegador es muy antiguo: ábrelo en Chrome o Safari actualizados.' : 'El enlace está incompleto. Pide a tu docente que te lo vuelva a enviar o escanea de nuevo el QR.') + '</p></div>'; return; }
  const cls = v => v == null ? 'na' : v >= 80 ? 'ok' : v >= d.ap ? 'warn' : 'bad';
  const as = d.as || [0, 0, []];
  let h = '<div class="top">' + logo + '<div><b>' + esc(d.g) + '</b><small>' + esc(d.pl || '') + '</small></div></div>';
  h += '<div class="card"><p class="mut sm">' + esc(d.p) + ' · No. de lista ' + esc(d.n) + ' · ' + esc(d.i) + '</p><div class="big"><div class="cal ' + cls(d.c) + '">' + (d.c == null ? '—' : esc(d.c)) + '</div><div><h1>' + (d.c == null ? 'Aún sin calificación' : d.c >= d.ap ? 'Va aprobando' : 'Va abajo de ' + esc(d.ap)) + '</h1><p class="sm mut">Al ' + esc(fecha(d.f)) + (d.ec ? ' · en curso (faltan rubros por calificar)' : '') + '. Se aprueba con ' + esc(d.ap) + '.</p></div></div>' +
    (d.to != null && d.c != null && d.to > d.c ? '<p class="sm">Si entrega lo pendiente puede llegar a <b>' + esc(d.to) + '</b>.</p>' : '') +
    (d.ne != null ? '<p class="sm">' + (d.ne > 100 ? 'Aunque saque 100 en el examen no le alcanza: necesita entregar lo pendiente.' : d.ne <= 0 ? 'Con lo que lleva ya aprueba, pero debe presentar el examen.' : 'En el examen necesita al menos <b>' + esc(d.ne) + '</b>.') + '</p>' : '') + '</div>';
  const rs = d.r || [], apo = r => r[2] == null ? null : Math.round(r[2] * Number(r[1] || 0) / 100), base = rs.reduce((s, r) => s + (r[2] == null ? 0 : Number(r[1] || 0)), 0), tot = rs.reduce((s, r) => s + Number(r[1] || 0), 0), lleva = rs.reduce((s, r) => s + (apo(r) || 0), 0);
  h += '<div class="card"><h2>Cómo se calcula</h2><table><thead><tr><th>Rubro</th><th>Vale</th><th style="text-align:right">Lleva</th></tr></thead><tbody>' + rs.map(r => '<tr><td>' + esc(r[0]) + '</td><td>' + esc(r[1]) + ' %</td><td class="n">' + (apo(r) == null ? '—' : apo(r) + ' %') + '</td></tr>').join('') + '</tbody></table>' +
    (base > 0 && base < tot ? '<p class="sm mut">Mientras falten rubros por calificar, la calificación se saca sobre lo ya calificado: lleva ' + lleva + ' % de ' + base + ' %.</p>' : '') +
    '<p class="sm" style="margin-top:10px"><b>Asistencia:</b> ' + (as[1] ? esc(as[0]) + ' de ' + esc(as[1]) + ' clases' + ((as[2] || []).length ? ' · faltó: ' + as[2].map(esc).join(', ') : ' · sin faltas') : 'sin registros todavía') + '.</p></div>';
  h += '<div class="card"><h2>Lo que le falta</h2>' + ((d.pe || []).length ? '<ul>' + d.pe.map(x => '<li><b>' + esc(x[0]) + ':</b> ' + esc(x[1]) + (x[3] != null ? ' <span class="chip ok">sube ' + esc(x[3]) + '</span>' : '') + (x[2] ? '<br><span class="sm mut">' + esc(x[2]) + '</span>' : '') + '</li>').join('') + '</ul><p class="sm mut">Lo entregado tarde vale ' + esc(d.td) + ' %. Entréguenlo lo antes posible.</p>' : '<p class="sm">No tiene pendientes registrados. 👏</p>') + '</div>';
  h += '<p class="foot">Consulta generada por ' + esc(d.d || 'su docente') + ' el ' + esc(fecha(d.f)) + '. Es una foto de ese día: si entrega algo, la calificación cambia. Las calificaciones oficiales se capturan el ' + esc(fecha(d.cap)) + '.<br>Estos datos viajan dentro del enlace; no se guardan en ningún servidor.</p>';
  m.innerHTML = h; document.title = 'No. ' + d.n + ' · ' + d.p + ' · ' + d.g;
})();
</script>
</body>
</html>
