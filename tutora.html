<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0e5e5a">
<title>Tutoría del grupo · Escuadra</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<style>
:root { --bg:#f2f5f4; --s:#fff; --s2:#eaf0ee; --ink:#12221f; --mut:#5a6c68; --line:#d9e3e0; --brand:#0e5e5a; --bink:#fff; --ok:#1c7c45; --oks:#dcf2e5; --warn:#9a5a00; --warns:#ffefd2; --bad:#bf342b; --bads:#fbe2df; color-scheme: light }
@media (prefers-color-scheme: dark) { :root { --bg:#0b1312; --s:#13201e; --s2:#1a2b28; --ink:#e4eeec; --mut:#94a8a4; --line:#25403b; --brand:#3cb4a8; --bink:#04201d; --ok:#52c585; --oks:#143022; --warn:#f0a440; --warns:#3a2a12; --bad:#ff7b71; --bads:#3d1c1a; color-scheme: dark } }
* { box-sizing: border-box } body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif }
main { max-width:640px; margin:0 auto; padding:16px 16px 40px }
.top { display:flex; align-items:center; gap:10px; margin:4px 0 14px } .top svg { width:34px; height:34px } .top b { display:block; font-size:1.05rem } .top small { color:var(--mut) }
.card { background:var(--s); border:1px solid var(--line); border-radius:14px; padding:14px 16px; margin:0 0 12px }
h1 { font-size:1.2rem; margin:0 0 6px } h2 { font-size:1rem; margin:0 0 8px } p { margin:.3em 0 .6em } .mut { color:var(--mut) } .sm { font-size:.85rem }
input { width:100%; font:inherit; font-size:1.4rem; letter-spacing:.3em; text-align:center; padding:10px; border:1.5px solid var(--line); border-radius:11px; background:var(--s); color:var(--ink) }
.btn { display:block; width:100%; padding:12px; border-radius:11px; border:0; background:var(--brand); color:var(--bink); font:inherit; font-weight:700; margin-top:10px; cursor:pointer }
table { width:100%; border-collapse:collapse; font-size:.88rem } td, th { padding:6px 4px; border-bottom:1px solid var(--line); text-align:left } th { font-size:.72rem; color:var(--mut); text-transform:uppercase } td.c, th.c { text-align:center }
.chip { display:inline-block; padding:1px 8px; border-radius:999px; font-size:.75rem; font-weight:700; background:var(--s2) }
.ok { background:var(--oks); color:var(--ok) } .warn { background:var(--warns); color:var(--warn) } .bad { background:var(--bads); color:var(--bad) }
.kp { display:grid; grid-template-columns:repeat(3,1fr); gap:8px } .kp div { background:var(--s2); border-radius:11px; padding:8px; text-align:center } .kp b { display:block; font-size:1.3rem }
ul { padding-left:18px; margin:4px 0 } li { margin:3px 0 } .foot { font-size:.76rem; color:var(--mut); text-align:center; margin-top:16px }
</style>
</head>
<body>
<main id="m"><p>Cargando…</p></main>
<script>
(function () {
  'use strict';
  const m = document.getElementById('m');
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const MES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  const fc = s => { const p = String(s || '').split('-').map(Number); return p.length === 3 ? p[2] + ' ' + MES[p[1] - 1] : ''; };
  const logo = '<svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="15" fill="#0e5e5a"/><path d="M15 51V13l38 38z" fill="#fff"/><path d="M22 44V30l14 14z" fill="#0e5e5a"/><circle cx="46" cy="18" r="5.5" fill="#f0a500"/></svg>';
  const h = location.hash.slice(1);
  function pidePin(err) {
    m.innerHTML = '<div class="top">' + logo + '<div><b>Tutoría del grupo</b><small>Vista de solo lectura</small></div></div><div class="card"><h1>🔒 Escribe el PIN</h1><p class="sm mut">El docente te lo dio aparte. Los datos están cifrados dentro de este enlace y no se guardan en ningún servidor.</p><input id="pin" type="password" inputmode="numeric" maxlength="8" autocomplete="off">' + (err ? '<p class="sm" style="color:var(--bad)">' + err + '</p>' : '') + '<button class="btn" id="ok">Abrir</button></div>';
    const go = () => abre(document.getElementById('pin').value.trim());
    document.getElementById('ok').onclick = go; document.getElementById('pin').onkeydown = e => { if (e.key === 'Enter') go(); };
    document.getElementById('pin').focus();
  }
  async function abre(pin) {
    try {
      const b = atob(h.slice(1).replace(/-/g, '+').replace(/_/g, '/')), by = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) by[i] = b.charCodeAt(i);
      const z = by[0], salt = by.slice(1, 17), iv = by.slice(17, 29), ct = by.slice(29);
      const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pin), 'PBKDF2', false, ['deriveKey']);
      const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: salt, iterations: 200000, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
      let raw = new Uint8Array(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: iv }, key, ct));
      if (z) raw = new Uint8Array(await new Response(new Blob([raw]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer());
      pinta(JSON.parse(new TextDecoder().decode(raw)));
    } catch (e) { pidePin('PIN incorrecto o enlace incompleto.'); }
  }
  function pinta(d) {
    const N = { mal: ['🔴', 'bad'], reg: ['🟡', 'warn'], bien: ['🟢', 'ok'] }, al = d.al || [], cnt = k => al.filter(x => x[3] === k).length;
    const at = al.filter(x => x[4] || x[5] === 'seg' || x[5] === 'can');
    let o = '<div class="top">' + logo + '<div><b>Tutoría · ' + esc(d.g) + '</b><small>' + esc(d.pl) + ' · al ' + fc(d.f) + ' · ' + esc(d.p) + '</small></div></div>';
    o += '<div class="card"><div class="kp"><div class="bad"><b>' + cnt('mal') + '</b>van mal</div><div class="warn"><b>' + cnt('reg') + '</b>regular</div><div class="ok"><b>' + cnt('bien') + '</b>van bien</div></div>' + (d.cs ? '<p class="sm mut" style="margin-top:8px">Próximo consejo técnico: ' + fc(d.cs) + '</p>' : '') + '</div>';
    o += '<div class="card"><h2>🚨 Alerta temprana (Yo no abandono)</h2><p class="sm mut">A: 2 o más faltas en 30 días · B: va mal en el semáforo · C: 3 o más llamadas de atención. Dos o más señales = atención urgente.</p>' + (at.length ? '<ul>' + at.map(x => '<li><b>' + x[0] + '. ' + esc(x[1]) + '</b> ' + (x[4] ? x[4].split('').map(s => '<span class="chip ' + (x[4].length >= 2 ? 'bad' : 'warn') + '">' + s + '</span>').join(' ') : '') + (x[5] === 'seg' ? ' <span class="chip warn">en seguimiento</span>' : x[5] === 'can' ? ' <span class="chip">canalizado</span>' : '') + '</li>').join('') + '</ul>' : '<p class="sm">Nadie con señales de alerta. 👏</p>') + '</div>';
    o += '<div class="card"><h2>👥 Grupo</h2><table><thead><tr><th>#</th><th>Alumno</th><th class="c">Faltas (30 d)</th><th class="c">Semáforo</th></tr></thead><tbody>' + al.map(x => '<tr><td>' + x[0] + '</td><td>' + esc(x[1]) + '</td><td class="c">' + (x[2] ? '<span class="chip ' + (x[2] >= 2 ? 'bad' : '') + '">' + x[2] + '</span>' : '0') + '</td><td class="c">' + (N[x[3]] ? N[x[3]][0] : '—') + '</td></tr>').join('') + '</tbody></table></div>';
    if ((d.co || []).length) o += '<div class="card"><h2>💵 Cooperaciones</h2>' + d.co.map(c => '<p><b>' + esc(c[0]) + '</b> · $' + c[1] + ' c/u · pagaron ' + c[2] + ', pendientes ' + c[3] + ' · en caja $' + c[4] + (c[5].length ? '<br><span class="sm mut">Pendientes (no. de lista): ' + c[5].join(', ') + '</span>' : '') + '</p>').join('') + '</div>';
    if ((d.pn || []).length) o += '<div class="card"><h2>📝 Plan de tutoría</h2><ul>' + d.pn.map(x => '<li>' + (x[0] ? '<b>' + fc(x[0]) + '</b> · ' : '') + esc(x[1]) + (x[2] ? ' <span class="chip">' + esc(x[2]) + '</span>' : '') + '</li>').join('') + '</ul></div>';
    o += '<p class="foot">Compartido por ' + esc(d.d) + ' el ' + fc(d.f) + '. Solo lectura; es una foto de ese día. Datos escolares confidenciales: no los reenvíes.</p>';
    m.innerHTML = o; document.title = 'Tutoría · ' + d.g;
  }
  if (!h || h[0] !== 'x' || !window.crypto || !crypto.subtle) m.innerHTML = '<div class="card"><h1>No se pudo abrir</h1><p>El enlace está incompleto o tu navegador es muy antiguo.</p></div>'; else pidePin();
})();
</script>
</body>
</html>
