<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0e5e5a">
<title>Encuesta anónima · Escuadra</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
:root { --bg:#f2f5f4; --s:#fff; --s2:#eaf0ee; --ink:#12221f; --mut:#5a6c68; --line:#d9e3e0; --brand:#0e5e5a; --bink:#fff; --soft:#d8eeeb; color-scheme: light }
@media (prefers-color-scheme: dark) { :root { --bg:#0b1312; --s:#13201e; --s2:#1a2b28; --ink:#e4eeec; --mut:#94a8a4; --line:#25403b; --brand:#3cb4a8; --bink:#04201d; --soft:#173935; color-scheme: dark } }
* { box-sizing: border-box } body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif }
main { max-width:560px; margin:0 auto; padding:16px 16px 40px }
.top { display:flex; align-items:center; gap:10px; margin:4px 0 14px } .top svg { width:34px; height:34px } .top b { display:block } .top small { color:var(--mut) }
.card { background:var(--s); border:1px solid var(--line); border-radius:14px; padding:14px 16px; margin:0 0 12px }
h1 { font-size:1.2rem; margin:0 0 6px } h2 { font-size:1.02rem; margin:0 0 10px } p { margin:.3em 0 .6em } .mut { color:var(--mut) } .sm { font-size:.86rem }
.caras { display:flex; justify-content:space-between; gap:6px } .caras button { flex:1; font-size:1.9rem; padding:8px 0; border:2px solid var(--line); border-radius:12px; background:var(--s); cursor:pointer }
.caras button.on { border-color:var(--brand); background:var(--soft) }
.op { display:block; width:100%; text-align:left; padding:10px 12px; margin:6px 0; border:1.5px solid var(--line); border-radius:11px; background:var(--s); color:var(--ink); font:inherit; cursor:pointer }
.op.on { border-color:var(--brand); background:var(--soft); font-weight:600 }
textarea, input[type=text] { width:100%; font:inherit; padding:10px; border:1.5px solid var(--line); border-radius:11px; background:var(--s); color:var(--ink) }
.btn { display:block; width:100%; padding:13px; border-radius:11px; border:0; background:var(--brand); color:var(--bink); font:inherit; font-weight:700; cursor:pointer }
.btn:disabled { opacity:.6 } .foot { font-size:.76rem; color:var(--mut); text-align:center; margin-top:16px }
</style>
</head>
<body>
<main id="m"><p>Cargando…</p></main>
<script src="config.js"></script>
<script>
(async function () {
  'use strict';
  const m = document.getElementById('m');
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const logo = '<svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="15" fill="#0e5e5a"/><path d="M15 51V13l38 38z" fill="#fff"/><path d="M22 44V30l14 14z" fill="#0e5e5a"/><circle cx="46" cy="18" r="5.5" fill="#f0a500"/></svg>';
  const CARAS = ['😣', '😕', '😐', '🙂', '😄'];
  async function lee() {
    const h = location.hash.slice(1); if (!h) throw new Error('vacío');
    const b = atob(h.slice(1).replace(/-/g, '+').replace(/_/g, '/')), by = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) by[i] = b.charCodeAt(i);
    const txt = h[0] === 'z' ? await new Response(new Blob([by]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text() : new TextDecoder().decode(by);
    return JSON.parse(txt);
  }
  let d; try { d = await lee(); } catch (e) { m.innerHTML = '<div class="card"><h1>No se pudo abrir la encuesta</h1><p>Escanea otra vez el QR.</p></div>'; return; }
  const LS = 'escuadra.enc.' + d.e; let ya = false; try { ya = !!localStorage.getItem(LS); } catch (e) { }
  const head = '<div class="top">' + logo + '<div><b>Encuesta anónima</b><small>' + esc(d.g) + '</small></div></div>';
  if (ya) { m.innerHTML = head + '<div class="card"><h1>✓ Ya contestaste</h1><p>Gracias. Tu profe va a contarles qué hará con lo que dijeron.</p></div>'; return; }
  const r = {};
  function pinta() {
    m.innerHTML = head + '<div class="card"><p class="sm mut">No pide tu nombre ni tu número de lista. Contesta con honestidad: sirve para mejorar la clase.</p></div>' +
      d.q.map((q, i) => '<div class="card"><h2>' + (i + 1) + '. ' + esc(q.t) + '</h2>' +
        (q.tipo === 'escala' ? '<div class="caras">' + CARAS.map((c, k) => '<button type="button" data-q="' + i + '" data-v="' + (k + 1) + '" class="' + (r['p' + i] === k + 1 ? 'on' : '') + '" aria-label="' + (k + 1) + ' de 5">' + c + '</button>').join('') + '</div>'
          : q.tipo === 'opciones' ? (q.ops || []).map(o => '<button type="button" class="op' + ((r['p' + i] || []).indexOf(o) >= 0 ? ' on' : '') + '" data-q="' + i + '" data-o="' + esc(o) + '">' + esc(o) + '</button>').join('') + '<input type="text" id="o' + i + '" maxlength="200" placeholder="Otra (opcional)" value="' + esc(r['p' + i + 'o'] || '') + '">'
          : '<textarea id="t' + i + '" rows="3" maxlength="400" placeholder="Escribe aquí (opcional)">' + esc(r['p' + i] || '') + '</textarea>') + '</div>').join('') +
      '<button class="btn" id="env">Enviar</button><p class="foot">Tus respuestas llegan sin tu nombre. Solo tu profe puede leerlas.</p>';
    m.querySelectorAll('[data-v]').forEach(b => b.onclick = () => { guarda(); r['p' + b.dataset.q] = Number(b.dataset.v); pinta(); });
    m.querySelectorAll('[data-o]').forEach(b => b.onclick = () => { guarda(); const k = 'p' + b.dataset.q, l = r[k] = r[k] || [], j = l.indexOf(b.dataset.o); if (j >= 0) l.splice(j, 1); else if (l.length < 3) l.push(b.dataset.o); pinta(); });
    document.getElementById('env').onclick = envia;
  }
  function guarda() { d.q.forEach((q, i) => { const t = document.getElementById('t' + i), o = document.getElementById('o' + i); if (t) r['p' + i] = t.value.trim().slice(0, 400); if (o) r['p' + i + 'o'] = o.value.trim().slice(0, 200); }); }
  async function envia() {
    guarda(); const bt = document.getElementById('env'); bt.disabled = true; bt.textContent = 'Enviando…';
    try {
      const c = window.ESCUADRA_CONFIG || {}; if (!c.supabaseUrl || !c.supabaseAnonKey || !d.o) throw new Error('Esta encuesta no está conectada. Avísale a tu profe.');
      const res = await fetch(String(c.supabaseUrl).replace(/\/$/, '') + '/rest/v1/escuadra_encuesta', { method: 'POST', headers: { apikey: c.supabaseAnonKey, Authorization: 'Bearer ' + c.supabaseAnonKey, 'Content-Type': 'application/json', Prefer: 'return=minimal' }, body: JSON.stringify({ owner: d.o, encuesta: d.e, resp: r }) });
      if (!res.ok) throw new Error('No se pudo enviar (' + res.status + '). Intenta de nuevo en un momento.');
      try { localStorage.setItem(LS, '1'); } catch (e) { }
      m.innerHTML = head + '<div class="card"><h1>✓ ¡Gracias!</h1><p>Tu respuesta llegó sin tu nombre. La próxima clase tu profe les cuenta qué hará con lo que dijeron.</p></div>';
    } catch (e) { bt.disabled = false; bt.textContent = 'Enviar'; alert(e.message); }
  }
  pinta();
})();
</script>
</body>
</html>
