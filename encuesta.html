<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0e5e5a">
<title>Encuesta anónima · Escuadra</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<style>
:root { --bg:#f2f5f4; --s:#fff; --s2:#eaf0ee; --ink:#12221f; --mut:#5a6c68; --line:#d9e3e0; --brand:#0e5e5a; --bink:#fff; --soft:#d8eeeb; color-scheme: light }
@media (prefers-color-scheme: dark) { :root { --bg:#0b1312; --s:#13201e; --s2:#1a2b28; --ink:#e4eeec; --mut:#94a8a4; --line:#25403b; --brand:#3cb4a8; --bink:#04201d; --soft:#173935; color-scheme: dark } }
* { box-sizing: border-box } body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif }
main { max-width:560px; margin:0 auto; padding:16px 16px 40px }
.top { display:flex; align-items:center; gap:10px; margin:4px 0 14px } .top svg { width:34px; height:34px } .top b { display:block } .top small { color:var(--mut) }
.card { background:var(--s); border:1px solid var(--line); border-radius:14px; padding:14px 16px; margin:0 0 12px }
h1 { font-size:1.2rem; margin:0 0 6px } h2 { font-size:1.02rem; margin:0 0 10px } p { margin:.3em 0 .6em } .mut { color:var(--mut) } .sm { font-size:.86rem }
.caras { display:flex; justify-content:space-between; gap:6px } .caras button { flex:1; font-size:1.9rem; padding:8px 0; border:2px solid var(--line); border-radius:12px; background:var(--s); cursor:pointer }
.caras button.on { border-color:var(--brand); background:var(--soft) }
.op { display:block; width:100%; text-align:left; padding:10px 12px; margin:6px 0; border:1.5px solid var(--line); border-radius:11px; background:var(--s); color:var(--ink); font:inherit; cursor:pointer }
.op.on { border-color:var(--brand); background:var(--soft); font-weight:600 }
textarea, input[type=text] { width:100%; font:inherit; padding:10px; border:1.5px solid var(--line); border-radius:11px; background:var(--s); color:var(--ink) }
.btn { display:block; width:100%; padding:13px; border-radius:11px; border:0; background:var(--brand); color:var(--bink); font:inherit; font-weight:700; cursor:pointer }
.btn:disabled { opacity:.6 } .foot { font-size:.76rem; color:var(--mut); text-align:center; margin-top:16px }
.nums{display:flex;flex-wrap:wrap;gap:6px}.nums .op{width:3.2em;text-align:center}
</style>
</head>
<body>
<main id="m"><p>Cargando…</p></main>
<script src="config.js"></script>
<script>
(async function () {
  'use strict';
  const m = document.getElementById('m');
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const logo = '<svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="15" fill="#0e5e5a"/><path d="M15 51V13l38 38z" fill="#fff"/><path d="M22 44V30l14 14z" fill="#0e5e5a"/><circle cx="46" cy="18" r="5.5" fill="#f0a500"/></svg>';
  const CARAS = ['😣', '😕', '😐', '🙂', '😄'];
  async function lee() {
    const h = location.hash.slice(1); if (!h) throw new Error('vacío');
    const b = atob(h.slice(1).replace(/-/g, '+').replace(/_/g, '/')), by = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) by[i] = b.charCodeAt(i);
    const txt = h[0] === 'z' ? await new Response(new Blob([by]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text() : new TextDecoder().decode(by);
    return JSON.parse(txt);
  }
  let d; try { d = await lee(); } catch (e) { m.innerHTML = '<div class="card"><h1>No se pudo abrir la encuesta</h1><p>Escanea otra vez el QR.</p></div>'; return; }
  // v1.46.0: buzón anónimo (k: 'buz') y coevaluación del proyecto (k: 'coe')
  const manda = async resp => { const c = window.ESCUADRA_CONFIG || {}; if (!c.supabaseUrl || !c.supabaseAnonKey || !d.o) throw new Error('No está conectado. Avísale a tu profe.');
    const res = await fetch(String(c.supabaseUrl).replace(/\/$/, '') + '/rest/v1/escuadra_encuesta', { method: 'POST', headers: { apikey: c.supabaseAnonKey, Authorization: 'Bearer ' + c.supabaseAnonKey, 'Content-Type': 'application/json', Prefer: 'return=minimal' }, body: JSON.stringify({ owner: d.o, encuesta: d.e, resp: resp }) });
    if (!res.ok) throw new Error('No se pudo enviar (' + res.status + '). Intenta de nuevo en un momento.'); };
  if (d.k === 'buz') {
    const TI = [['sug', '💡 Sugerencia'], ['duda', '❓ Duda de la clase'], ['preo', '😟 Algo me preocupa'], ['grac', '👏 Agradecimiento']], LB = 'escuadra.buz.' + d.e; let tipo = 'sug';
    const hd = '<div class="top">' + logo + '<div><b>Buzón anónimo</b><small>' + esc(d.g) + '</small></div></div>';
    const pintaB = (txt) => { m.innerHTML = hd + '<div class="card"><p class="sm mut">No pide tu nombre. Lo lee solo tu profe.</p><h2>¿Qué nos quieres decir?</h2>' + TI.map(t => '<button type="button" class="op' + (t[0] === tipo ? ' on' : '') + '" data-t="' + t[0] + '">' + t[1] + '</button>').join('') + '<textarea id="bt" rows="5" maxlength="600" placeholder="Escribe aquí">' + esc(txt || '') + '</textarea></div><button class="btn" id="env">Enviar</button><p class="foot">⚠️ Si estás en peligro o alguien te lastima, no esperes: habla hoy con orientación o con un adulto de confianza.</p>';
      m.querySelectorAll('[data-t]').forEach(b => b.onclick = () => { tipo = b.dataset.t; pintaB(document.getElementById('bt').value); });
      document.getElementById('env').onclick = async () => { const t = document.getElementById('bt').value.trim(), bt = document.getElementById('env'); if (t.length < 3) { alert('Escribe tu mensaje.'); return; }
        let ul = 0; try { ul = Number(localStorage.getItem(LB)) || 0; } catch (e) { } if (Date.now() - ul < 120000) { alert('Espera un par de minutos antes de mandar otro mensaje.'); return; }
        bt.disabled = true; bt.textContent = 'Enviando…'; try { await manda({ tipo: tipo, t: t.slice(0, 600) }); try { localStorage.setItem(LB, String(Date.now())); } catch (e) { } m.innerHTML = hd + '<div class="card"><h1>✓ ¡Gracias!</h1><p>Tu mensaje llegó sin tu nombre.</p></div>'; } catch (e) { bt.disabled = false; bt.textContent = 'Enviar'; alert(e.message); } }; };
    pintaB(''); return;
  }
  if (d.k === 'lis') { // v1.49.0: lista con QR
    const hd = '<div class="top">' + logo + '<div><b>Lista de hoy</b><small>' + esc(d.g) + '</small></div></div>', LK = 'escuadra.lis.' + d.e + '.' + d.f;
    let dev = ''; try { dev = localStorage.getItem('escuadra.dev') || ''; if (!dev) { dev = Math.random().toString(36).slice(2, 10); localStorage.setItem('escuadra.dev', dev); } } catch (e) { }
    let ya = null; try { ya = localStorage.getItem(LK); } catch (e) { }
    if (ya) { m.innerHTML = hd + '<div class="card"><h1>✓ Ya quedaste</h1><p>Desde este celular ya se registró el número <b>' + esc(ya) + '</b> hoy.</p></div>'; return; }
    m.innerHTML = hd + '<div class="card"><h2>¿Cuál es tu número de lista?</h2><div class="nums">' + (d.n || []).map(n => '<button type="button" class="op" data-n="' + n + '">' + esc(n) + '</button>').join('') + '</div><p class="sm mut">Elige el tuyo: desde este celular solo se puede registrar un número al día.</p></div>';
    m.querySelectorAll('[data-n]').forEach(b => b.onclick = async () => { const n = b.dataset.n; if (!confirm('¿Eres el número ' + n + '?')) return; m.querySelectorAll('[data-n]').forEach(x => { x.disabled = true; });
      try { await manda({ num: Number(n), f: d.f, w: d.w, tk: d.tk, dev: dev }); try { localStorage.setItem(LK, n); } catch (e) { } m.innerHTML = hd + '<div class="card"><h1>✓ ¡Listo!</h1><p>Quedaste registrado con el número <b>' + esc(n) + '</b>.</p></div>'; } catch (x) { m.querySelectorAll('[data-n]').forEach(y => { y.disabled = false; }); alert(x.message); } }); return;
  }
  if (d.k === 'coe') {
    const ESC = ['Nunca', 'A veces', 'Casi siempre', 'Siempre'], hd = '<div class="top">' + logo + '<div><b>' + esc(d.t || 'Coevaluación') + '</b><small>' + esc(d.g) + '</small></div></div>';
    let yo = null, eqi = -1; const ev = {};
    const elige = () => { m.innerHTML = hd + '<div class="card"><h2>¿Cuál es tu número de lista?</h2><div class="nums">' + d.eq.map((e, i) => e[1].map(a => '<button type="button" class="op" data-n="' + a[0] + '" data-e="' + i + '">' + esc(a[0]) + '</button>').join('')).join('') + '</div><p class="sm mut">Tu profe ve quién evaluó a quién; tus compañeros no.</p></div>';
      m.querySelectorAll('[data-n]').forEach(b => b.onclick = () => { yo = b.dataset.n; eqi = Number(b.dataset.e); let ya = false; try { ya = !!localStorage.getItem('escuadra.coe.' + d.e + '.' + yo); } catch (e) { } if (ya && !confirm('Ya contestaste con el número ' + yo + '. ¿Contestar de nuevo? (cuenta la última)')) return; pintaC(); }); };
    const pintaC = () => { const e = d.eq[eqi]; m.innerHTML = hd + '<div class="card"><p class="sm mut">' + esc(e[0]) + ' · Número ' + esc(yo) + '</p><p class="sm">Califica a cada integrante <b>y a ti</b>: 1 = nunca, 2 = a veces, 3 = casi siempre, 4 = siempre. Sé honesto: sirve para mejorar el trabajo en equipo.</p></div>' +
        e[1].map(a => '<div class="card"><h2>' + (String(a[0]) === String(yo) ? 'Tú (núm. ' + esc(yo) + ')' : 'Núm. ' + esc(a[0]) + ' · ' + esc(a[1])) + '</h2>' + d.cr.map((c, k) => '<p class="sm" style="margin:8px 0 4px"><b>' + esc(c) + '</b></p><div class="caras">' + [1, 2, 3, 4].map(v => '<button type="button" data-a="' + a[0] + '" data-c="' + k + '" data-v="' + v + '" class="' + (((ev[a[0]] || [])[k]) === v ? 'on' : '') + '" aria-label="' + ESC[v - 1] + '">' + v + '</button>').join('') + '</div>').join('') + '</div>').join('') +
        '<button class="btn" id="env">Enviar</button><p class="foot">1 nunca · 2 a veces · 3 casi siempre · 4 siempre</p>';
      m.querySelectorAll('[data-a]').forEach(b => b.onclick = () => { const l = ev[b.dataset.a] = ev[b.dataset.a] || []; l[Number(b.dataset.c)] = Number(b.dataset.v); const y = window.scrollY; pintaC(); window.scrollTo(0, y); });
      document.getElementById('env').onclick = async () => { const falta = e[1].some(a => d.cr.some((c, k) => !(ev[a[0]] || [])[k])); if (falta) { alert('Te falta calificar algún criterio.'); return; }
        const bt = document.getElementById('env'); bt.disabled = true; bt.textContent = 'Enviando…'; try { await manda({ de: Number(yo), ev: ev }); try { localStorage.setItem('escuadra.coe.' + d.e + '.' + yo, '1'); } catch (x) { } m.innerHTML = hd + '<div class="card"><h1>✓ ¡Gracias!</h1><p>Tu evaluación llegó.</p></div>'; } catch (x) { bt.disabled = false; bt.textContent = 'Enviar'; alert(x.message); } }; };
    elige(); return;
  }
  const LS = 'escuadra.enc.' + d.e; let ya = false; try { ya = !!localStorage.getItem(LS); } catch (e) { }
  const head = '<div class="top">' + logo + '<div><b>Encuesta anónima</b><small>' + esc(d.g) + '</small></div></div>';
  if (ya) { m.innerHTML = head + '<div class="card"><h1>✓ Ya contestaste</h1><p>Gracias. Tu profe va a contarles qué hará con lo que dijeron.</p></div>'; return; }
  const r = {};
  function pinta() {
    m.innerHTML = head + '<div class="card"><p class="sm mut">No pide tu nombre ni tu número de lista. Contesta con honestidad: sirve para mejorar la clase.</p></div>' +
      d.q.map((q, i) => '<div class="card"><h2>' + (i + 1) + '. ' + esc(q.t) + '</h2>' +
        (q.tipo === 'escala' ? '<div class="caras">' + CARAS.map((c, k) => '<button type="button" data-q="' + i + '" data-v="' + (k + 1) + '" class="' + (r['p' + i] === k + 1 ? 'on' : '') + '" aria-label="' + (k + 1) + ' de 5">' + c + '</button>').join('') + '</div>'
          : q.tipo === 'opciones' ? (q.ops || []).map(o => '<button type="button" class="op' + ((r['p' + i] || []).indexOf(o) >= 0 ? ' on' : '') + '" data-q="' + i + '" data-o="' + esc(o) + '">' + esc(o) + '</button>').join('') + '<input type="text" id="o' + i + '" maxlength="200" placeholder="Otra (opcional)" value="' + esc(r['p' + i + 'o'] || '') + '">'
          : '<textarea id="t' + i + '" rows="3" maxlength="400" placeholder="Escribe aquí (opcional)">' + esc(r['p' + i] || '') + '</textarea>') + '</div>').join('') +
      '<button class="btn" id="env">Enviar</button><p class="foot">Tus respuestas llegan sin tu nombre. Solo tu profe puede leerlas.</p>';
    m.querySelectorAll('[data-v]').forEach(b => b.onclick = () => { guarda(); r['p' + b.dataset.q] = Number(b.dataset.v); pinta(); });
    m.querySelectorAll('[data-o]').forEach(b => b.onclick = () => { guarda(); const k = 'p' + b.dataset.q, l = r[k] = r[k] || [], j = l.indexOf(b.dataset.o); if (j >= 0) l.splice(j, 1); else if (l.length < 3) l.push(b.dataset.o); pinta(); });
    document.getElementById('env').onclick = envia;
  }
  function guarda() { d.q.forEach((q, i) => { const t = document.getElementById('t' + i), o = document.getElementById('o' + i); if (t) r['p' + i] = t.value.trim().slice(0, 400); if (o) r['p' + i + 'o'] = o.value.trim().slice(0, 200); }); }
  async function envia() {
    guarda(); const bt = document.getElementById('env'); bt.disabled = true; bt.textContent = 'Enviando…';
    try {
      const c = window.ESCUADRA_CONFIG || {}; if (!c.supabaseUrl || !c.supabaseAnonKey || !d.o) throw new Error('Esta encuesta no está conectada. Avísale a tu profe.');
      const res = await fetch(String(c.supabaseUrl).replace(/\/$/, '') + '/rest/v1/escuadra_encuesta', { method: 'POST', headers: { apikey: c.supabaseAnonKey, Authorization: 'Bearer ' + c.supabaseAnonKey, 'Content-Type': 'application/json', Prefer: 'return=minimal' }, body: JSON.stringify({ owner: d.o, encuesta: d.e, resp: r }) });
      if (!res.ok) throw new Error('No se pudo enviar (' + res.status + '). Intenta de nuevo en un momento.');
      try { localStorage.setItem(LS, '1'); } catch (e) { }
      m.innerHTML = head + '<div class="card"><h1>✓ ¡Gracias!</h1><p>Tu respuesta llegó sin tu nombre. La próxima clase tu profe les cuenta qué hará con lo que dijeron.</p></div>';
    } catch (e) { bt.disabled = false; bt.textContent = 'Enviar'; alert(e.message); }
  }
  pinta();
})();
</script>
</body>
</html>
