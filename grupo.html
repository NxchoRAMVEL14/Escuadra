<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0e5e5a">
<title>Tablero del grupo · Escuadra</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<style>
:root { --bg:#f2f5f4; --s:#fff; --s2:#eaf0ee; --ink:#12221f; --mut:#5a6c68; --line:#d9e3e0; --brand:#0e5e5a; --warn:#9a5a00; --warns:#ffefd2; color-scheme: light }
@media (prefers-color-scheme: dark) { :root { --bg:#0b1312; --s:#13201e; --s2:#1a2b28; --ink:#e4eeec; --mut:#94a8a4; --line:#25403b; --brand:#3cb4a8; --warn:#f0a440; --warns:#3a2a10; color-scheme: dark } }
* { box-sizing: border-box } body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif }
main { max-width:560px; margin:0 auto; padding:16px 16px 40px }
.top { display:flex; align-items:center; gap:10px; margin:4px 0 14px } .top svg { width:34px; height:34px } .top b { display:block; font-size:1.05rem } .top small { color:var(--mut) }
.card { background:var(--s); border:1px solid var(--line); border-radius:14px; padding:14px 16px; margin:0 0 12px }
h1 { font-size:1.3rem; margin:0 0 4px } h2 { font-size:1.05rem; margin:0 0 8px } p { margin:.3em 0 .6em } .mut { color:var(--mut) } .sm { font-size:.86rem }
ul { padding-left:0; list-style:none; margin:0 } li { padding:9px 0; border-bottom:1px solid var(--line); display:flex; gap:10px } li:last-child { border:0 }
.f { flex:none; min-width:74px; font-weight:700; color:var(--brand) } .pronto { background:var(--warns); color:var(--warn); border-radius:8px; padding:0 6px; font-size:.78rem; font-weight:700; margin-left:4px }
.foot { font-size:.78rem; color:var(--mut); text-align:center; margin-top:18px }
</style>
</head>
<body>
<main id="m"><p>Cargando…</p></main>
<script>
(async function () {
  'use strict';
  const m = document.getElementById('m');
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const logo = '<svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="15" fill="#0e5e5a"/><path d="M15 51V13l38 38z" fill="#fff"/><path d="M22 44V30l14 14z" fill="#0e5e5a"/><circle cx="46" cy="18" r="5.5" fill="#f0a500"/></svg>';
  async function lee() {
    const h = location.hash.slice(1); if (!h) throw new Error('vacío');
    const b = atob(h.slice(1).replace(/-/g, '+').replace(/_/g, '/')), bytes = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) bytes[i] = b.charCodeAt(i);
    let txt;
    if (h[0] === 'z') { if (!window.DecompressionStream) throw new Error('nav'); txt = await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text(); }
    else txt = new TextDecoder().decode(bytes);
    return JSON.parse(txt);
  }
  let d; try { d = await lee(); } catch (e) { m.innerHTML = '<div class="card"><h1>No se pudo abrir</h1><p>' + (e.message === 'nav' ? 'Tu navegador es muy antiguo: ábrelo en Chrome o Safari actualizados.' : 'El enlace está incompleto. Escanea otra vez el QR.') + '</p></div>'; return; }
  const DIAS = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'], MES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
  const fecha = f => { const x = new Date(f + 'T12:00:00'); return DIAS[x.getDay()] + ' ' + x.getDate() + ' ' + MES[x.getMonth()]; };
  const hoy = new Date(); hoy.setHours(12, 0, 0, 0);
  const faltan = f => Math.round((new Date(f + 'T12:00:00') - hoy) / 86400000);
  const pronto = f => { const n = faltan(f); return n < 0 ? '' : n === 0 ? '<span class="pronto">hoy</span>' : n === 1 ? '<span class="pronto">mañana</span>' : n <= 3 ? '<span class="pronto">en ' + n + ' días</span>' : ''; };
  let o = '<div class="top">' + logo + '<div><b>' + esc(d.g) + ' · ' + esc(d.p) + '</b><small>' + esc(d.pl) + ' · actualizado el ' + esc(fecha(d.f)) + '</small></div></div>';
  const en = (d.en || []).filter(x => faltan(x[0]) >= 0);
  o += '<div class="card"><h2>📌 Próximas entregas</h2>' + (en.length ? '<ul>' + en.map(x => '<li><span class="f">' + esc(fecha(x[0])) + '</span><span>' + esc(x[1]) + pronto(x[0]) + '</span></li>').join('') + '</ul>' : '<p class="sm mut">Nada pendiente por ahora.</p>') + '</div>';
  if (d.ex && faltan(d.ex[0]) >= 0) o += '<div class="card"><h2>📝 Examen: ' + esc(fecha(d.ex[0])) + pronto(d.ex[0]) + '</h2>' + ((d.ex[1] || []).length ? '<p class="sm mut">Temas que entran:</p><ul>' + d.ex[1].map(t => '<li>' + esc(t) + '</li>').join('') + '</ul>' : '') + '</div>';
  o += '<div class="card"><p class="sm">El ' + esc(d.p) + ' termina el <b>' + esc(fecha(d.pf)) + '</b>.' + (d.d ? ' Docente: ' + esc(d.d) + '.' : '') + '</p></div>';
  o += '<p class="foot">Es una foto del ' + esc(fecha(d.f)) + '. Si algo cambia, tu profe imprime otro QR.</p>';
  m.innerHTML = o;
})();
</script>
</body>
</html>
